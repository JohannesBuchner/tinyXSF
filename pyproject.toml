[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools", "wheel"]  # PEP 508 specifications.
build-backend = "setuptools.build_meta"

[project]
name = "tinyxsf"
version = "1.2.2"
description = "Fast X-ray spectral fitting"
readme = "README.rst"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "scikit-learn", "tqdm", "jax", "ultranest", "corner", "matplotlib"]
license = {file = "LICENSE"}
authors = [
    { name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com" },
]
keywords = ["astronomy", "X-ray", "spectroscopy", "spectral fitting", "X-ray spectroscopy", "Bayesian inference", "astrophysics"]

[tool.setuptools]
# Declare the package explicitly: importing tinyxsf.model instantiates
# joblib.Memory('.') which can create a stray 'joblib/' cache directory in
# the source tree. Flat-layout auto-discovery then refuses to build with
# "Multiple top-level packages discovered in a flat-layout: ['joblib', 'tinyxsf']".
packages = ["tinyxsf"]

[project.scripts]
tinyxspec = "tinyxsf.tinyxspec:main"

[tool.pytest.ini_options]
collect_ignore = "['setup.py']"
addopts = "--junitxml=test-reports/junit.xml  --html=tests/reports/index.html"

[project.urls]
Homepage = "https://github.com/JohannesBuchner/tinyXSF"
Source = "https://github.com/JohannesBuchner/tinyXSF"
Documentation = "https://github.com/JohannesBuchner/tinyXSF"
