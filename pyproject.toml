[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools", "wheel"]  # PEP 508 specifications.
build-backend = "setuptools.build_meta"

[project]
name = "tinyxsf"
version = "1.2.1"
description = "Fast X-ray spectral fitting"
readme = "README.rst"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "scikit-learn", "tqdm", "jax", "ultranest", "corner", "matplotlib"]
license = {file = "LICENSE"}
authors = [
    { name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com" },
]
keywords = ["astronomy", "X-ray", "spectroscopy", "spectral fitting", "X-ray spectroscopy", "Bayesian inference", "astrophysics"]

[flake8]
style = "numpy"
check-return-types = false
exclude = "docs"
extend-ignore = "E203,W503,E501,F401,E128,E231,E124,SIM114,DOC105,DOC106,DOC107,DOC301,DOC501,DOC503,DOC203,B006,SIM102,SIM113,DOC202,DOC403,DOC404"
max-line-length = 160

[tool.pycodestyle]
count = false
ignore = "W191,W291,W293,E231"
max-line-length = 160
statistics = false

[tool.pytest.ini_options]
collect_ignore = "['setup.py']"
addopts = "--junitxml=test-reports/junit.xml  --html=tests/reports/index.html"
